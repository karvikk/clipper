name: Test and publish Clipper

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

      - name: Check embedded UI scripts
        run: node tools/check-ui.mjs

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build versioned Windows release
        shell: pwsh
        run: |
          $env:CLIPPER_VERSION = $env:GITHUB_REF_NAME
          cmd /c build.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $generatedNotes = gh api `
            --method POST `
            "repos/$env:GITHUB_REPOSITORY/releases/generate-notes" `
            --field "tag_name=$tag" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $notes = @"
          ## Что скачать

          - **Устанавливаете Clipper впервые?** Скачайте `ClipperSetup.bat` и `ClipperSetup.exe`. Запустите `.bat` — он проверит WebView2 и откроет установщик.
          - **Clipper уже установлен и нужно обновление?** Скачайте только `ClipperUpdate.zip`, распакуйте архив и запустите `ApplyUpdate.bat`. Настройки, ключ и клипы сохранятся.
          - `SHA256SUMS.txt` содержит контрольные суммы файлов.

          ## Изменения

          $($generatedNotes.body)
          "@
          gh release create $tag `
            release/ClipperSetup.bat `
            release/ClipperSetup.exe `
            release/ClipperUpdate.zip `
            release/SHA256SUMS.txt `
            --repo $env:GITHUB_REPOSITORY `
            --title "Clipper $tag" `
            --notes $notes
